name: AFL++ Fuzzing

on:
  workflow_dispatch:  # ТОЛЬКО ручной запуск через кнопку "Run workflow"
    inputs:
      duration:
        description: 'Duration in minutes'
        required: true
        default: '5'
        type: choice
        options:
          - '2'
          - '5'
          - '10'

jobs:
  fuzz:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install AFL++ and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          wget \
          afl++ \
          python3

    - name: Build libjpeg 9e
      run: |
        cd /tmp
        wget https://www.ijg.org/files/jpegsrc.v9e.tar.gz
        tar -xzf jpegsrc.v9e.tar.gz
        cd jpeg-9e
        ./configure --prefix=/usr/local
        make
        sudo make install
        sudo ldconfig

    - name: Build target with AFL++ and ASan
      run: |
        mkdir -p build_fuzz
        cd build_fuzz
        CC=afl-clang-fast CXX=afl-clang-fast++ \
        CFLAGS="-fsanitize=address -g" \
        CXXFLAGS="-fsanitize=address -g" \
        cmake ..
        make

    - name: Create seed corpus
      run: |
        mkdir -p seeds
        # Минимальный валидный JPEG (1x1 пиксель)
        echo -n -e '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00\xff\xdb\x00C\x00\x08\x06\x06\x07\x06\x05\x08\x07\x07\x07\t\t\x08\n\x0c\x14\r\x0c\x0b\x0b\x0c\x19\x12\x13\x0f\x14\x1d\x1a\x1f\x1e\x1d\x1a\x1c\x1c $.\x27 ",#\x1c\x1c(7),01444\x1f\x27444444444444\xff\xc0\x00\x0b\x08\x00\x01\x00\x01\x01\x01\x11\x00\xff\xc4\x00\x1f\x00\x00\x01\x05\x01\x01\x01\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x01\x02\x03\x04\x05\x06\x07\x08\t\n\x0b\xff\xc4\x00\xb5\x10\x00\x02\x01\x03\x03\x02\x04\x03\x05\x05\x04\x04\x00\x00\x01}\x01\x02\x03\x00\x04\x11\x05\x12!1A\x06\x13Qa\x07"q\x142\x81\x91\xa1\x08#B\xb1\xc1\x15R\xd1\xf0$3br\x82\t\n\x16\x17\x18\x19\x1a%&\x27()*456789:CDEFGHIJSTUVWXYZcdefghijstuvwxyz\x83\x84\x85\x86\x87\x88\x89\x8a\x92\x93\x94\x95\x96\x97\x98\x99\x9a\xa2\xa3\xa4\xa5\xa6\xa7\xa8\xa9\xaa\xb2\xb3\xb4\xb5\xb6\xb7\xb8\xb9\xba\xc2\xc3\xc4\xc5\xc6\xc7\xc8\xc9\xca\xd2\xd3\xd4\xd5\xd6\xd7\xd8\xd9\xda\xe1\xe2\xe3\xe4\xe5\xe6\xe7\xe8\xe9\xea\xf1\xf2\xf3\xf4\xf5\xf6\xf7\xf8\xf9\xfa\xff\xda\x00\x08\x01\x01\x00\x00?\x00\xfb\xd5\xdb\x20\xb8\xf3\xfe\x07\xff\xd9' > seeds/seed1.jpg

    - name: Run AFL++
      run: |
        mkdir -p findings
        timeout ${{ github.event.inputs.duration }}m afl-fuzz -i seeds -o findings -m none -t 1000 -- ./build_fuzz/jpeg_parser @@ || true
        
        if [ -f findings/fuzzer_stats ]; then
          cp findings/fuzzer_stats fuzz_stats.txt
        fi

    - name: Upload findings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: afl-findings
        path: findings/

    - name: Upload stats
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-stats
        path: fuzz_stats.txt

    - name: Generate Job Summary
      if: always()
      run: |
        echo "## 🐛 AFL++ Fuzzing Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f fuzz_stats.txt ]; then
          echo "### Statistics:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat fuzz_stats.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ -d findings/crashes ] && [ "$(ls -A findings/crashes 2>/dev/null)" ]; then
          CRASH_COUNT=$(ls findings/crashes | wc -l)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ❌ Crashes Found: $CRASH_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "Download the 'afl-findings' artifact to inspect crash files." >> $GITHUB_STEP_SUMMARY
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ No crashes found" >> $GITHUB_STEP_SUMMARY
        fi