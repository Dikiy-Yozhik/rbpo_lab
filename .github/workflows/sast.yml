name: SAST Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sast-scan:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install SAST tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck clang flawfinder

    - name: Run Cppcheck
      run: cppcheck --enable=all --inconclusive --std=c++17 main.cpp || true

    - name: Run Flawfinder
      run: flawfinder --minlevel=1 main.cpp || true