name: SCA Security Scan (SBOM + 2 Scanners)

on:
  push:
    branches: [ "main", "master", "vulnerable" ]
  pull_request:
    branches: [ "main", "master", "vulnerable" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sca-scan:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ==========================================
    # ШАГ 1: СБОРКА ОБРАЗА
    # ==========================================
    - name: Build Docker Image
      run: docker build -t jpeg-lab-sca .

    # ==========================================
    # ШАГ 2: ГЕНЕРАЦИЯ SBOM (Требование лабы)
    # ==========================================
    - name: Generate SBOM with Syft
      uses: anchore/sbom-action@v0
      with:
        image: jpeg-lab-sca
        format: json
        output-file: sbom.json

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom-json
        path: sbom.json

    # ==========================================
    # ШАГ 3: ИНСТРУМЕНТ 1 - TRIVY (Сканирование образа)
    # ==========================================
    - name: Run Trivy on Docker Image
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: 'jpeg-lab-sca'
        format: 'table'
        output: 'trivy_report.txt'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW'
        exit-code: '0'

    - name: Upload Trivy Report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-report
        path: trivy_report.txt

    - name: Run Trivy SARIF scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: 'jpeg-lab-sca'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true
      if: always()

    # ==========================================
    # ШАГ 4: ИНСТРУМЕНТ 2 - GRYPE (Сканирование SBOM)
    # ==========================================
    - name: Run Grype on SBOM
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
        # Grype сканирует именно сгенерированный SBOM-файл, а не образ заново
        grype sbom:sbom.json --output table > grype_report.txt || true

    - name: Upload Grype Report
      uses: actions/upload-artifact@v4
      with:
        name: grype-sbom-report
        path: grype_report.txt