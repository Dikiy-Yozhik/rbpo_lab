name: SCA Security Scan (2 Tools)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# ДОБАВЛЕНО: Явные права для токена GitHub
permissions:
  contents: read
  security-events: write # Разрешает загрузку SARIF во вкладку Security
  actions: read

jobs:
  sca-scan:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ==========================================
    # ИНСТРУМЕНТ 1: TRIVY
    # ==========================================
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        output: 'trivy_report.txt'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW'

    - name: Upload Trivy Report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-sca-report
        path: trivy_report.txt

    - name: Run Trivy SARIF scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      if: always()

    # ==========================================
    # ИНСТРУМЕНТ 2: OWASP DEPENDENCY-CHECK
    # ==========================================
    - name: OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'jpeg-parser-lab'
        path: '.'
        format: 'HTML'
        args: >
          --failOnCVSS 0
          --enableRetired

    - name: Upload Dependency-Check Report
      uses: actions/upload-artifact@v4
      with:
        name: owasp-dependency-check-report
        path: reports/dependency-check-report.html