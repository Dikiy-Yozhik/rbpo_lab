name: SCA Security Scan (Docker Image)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sca-scan:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ==========================================
    # ШАГ 1: Собираем Docker-образ (здесь скачивается libjpeg 9c)
    # ==========================================
    - name: Build Docker Image
      run: docker build -f Dockerfile.sca -t jpeg-lab-sca .

    # ==========================================
    # ИНСТРУМЕНТ 1: TRIVY (Сканирование образа)
    # ==========================================
    - name: Run Trivy on Docker Image
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: 'jpeg-lab-sca'
        format: 'table'
        output: 'trivy_report.txt'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW'
        exit-code: '0' # Не прерываем, чтобы сохранить отчет

    - name: Upload Trivy Report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-report
        path: trivy_report.txt

    - name: Run Trivy SARIF scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'image'
        image-ref: 'jpeg-lab-sca'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true # Защита от каскадных сбоев

    - name: Upload Trivy SARIF to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      if: always()
      continue-on-error: true # Игнорируем предупреждения GitHub о версиях

    # ==========================================
    # ИНСТРУМЕНТ 2: GRYPE (Сканирование образа)
    # ==========================================
    - name: Install Grype
      run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Run Grype on Docker Image
      run: grype jpeg-lab-sca --output table > grype_report.txt || true

    - name: Upload Grype Report
      uses: actions/upload-artifact@v4
      with:
        name: grype-image-report
        path: grype_report.txt